name: Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testmedhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testmedhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.6.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testmedhub
      ADMIN_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      PROD_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testmedhub
      TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/testmedhub
      HOST_REDIS: localhost
      PORT_REDIS: 6379

    defaults:
      run:
        working-directory: fastapi-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fastapi-app/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

  go:
    name: Go tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rate-limiter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: rate-limiter/go.mod
          cache-dependency-path: rate-limiter/go.sum

      - name: Run tests
        run: go test ./...
