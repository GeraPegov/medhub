services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.6.1-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin:
    build:
      context: ../admin-services
      dockerfile: Dockerfile
    environment:
      PROD_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/medhub?sslmode=disable
      SECRET_KEY: ${SECRET_KEY_GO}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      ADMIN_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/postgres
      PROD_DB_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/medhub
      HOST_REDIS: redis
      PORT_REDIS: ${PORT_REDIS}
      ADMIN_API_URL: http://admin:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin:
        condition: service_started
    ports:
      - ${MAIN_PORT}
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:

