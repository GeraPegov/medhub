{% extends "admin/base.html" %}

{% block admin_content %}
    <div class="period-stat">
        <form class="form-period-stat" action="/admin" method="get">
            <input type="hidden" name="csrf_token" value="{{ request.session['csrf_token'] }}">
            <input type="date" name="date_first" class="input-period-stat">
            <input type="date" name="date_last" class="input-period-stat">
            <button type="submit" class="btn-period-stat">Показать</button>
        </form>
    </div>

    <div class="content-stats">
        <div class="stat-item-first">
            <h3 class="stat-title">Общее количество пользователей</h3>
            {% if quantity_users is not none %}
                <p class="stat-value">{{ quantity_users }}</p>
            {% endif %}
        </div>

        <div class="stat-item-first">
            <h3 class="stat-title">Общее количество статей</h3>
            {% if quantity_articles is not none %}
                <p class="stat-value">{{ quantity_articles }}</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
