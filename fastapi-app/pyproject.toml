[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medhub"
version = "0.1.0"
description = "Medical Hub FastAPI Application"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlalchemy==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.15.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "jinja2==3.1.6",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "APScheduler==3.11.3",
    "aiohttp==3.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "faker==40.36.0",
    "ruff==0.16.3",
]

# Указываем setuptools, какие пакеты включать
[tool.setuptools.packages.find]
where = ["."]  # корень проекта
include = ["app*", "alembic*"]  # включаем app и alembic
exclude = ["tests*", "scripts*"]  # исключаем tests и scripts

# Или можно явно указать пакеты:
# [tool.setuptools]
# packages = ["app", "alembic"]

# Конфигурация Ruff
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".env"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

ignore = [
    "E501",  # line too long
    "B008",  # Depends() в FastAPI
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Конфигурация pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
]
